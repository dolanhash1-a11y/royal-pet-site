<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Royal Pet — Особистий кабінет</title>

<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><img src="../assets/royal-pet-logo.svg" alt="Royal Pet"><span>ROYAL PET</span></div><nav>
<button class="nav-item active" data-view="dashboard">◈ <span>Огляд</span></button><button class="nav-item" data-view="appointments">▣ <span>Записи</span><b id="new-count">0</b></button><button class="nav-item" data-view="calendar">▦ <span>Календар</span></button><button class="nav-item" data-view="clients">♙ <span>Клієнти</span></button><button class="nav-item" data-view="hours">◷ <span>Графік</span></button><button class="nav-item" data-view="reviews">★ <span>Відгуки</span></button><button class="nav-item" data-view="services">✂ <span>Послуги</span></button><button class="nav-item" data-view="home-editor">⌂ <span>Головна</span></button><button class="nav-item" data-view="booking-settings">✎ <span>Запис</span></button>
</nav><button id="logout" class="logout">Вийти</button></aside>
<main class="main"><header class="topbar"><div><div class="gold-label">ROYAL PET</div><h2 id="page-title">Огляд</h2></div><div class="top-actions"><a class="site-link" href="../" target="_blank" rel="noopener">Сайт</a><button class="notify-button" id="notify">🔔 <span id="notify-count">0</span></button></div></header>
<section id="view-dashboard" class="view"></section><section id="view-appointments" class="view hidden"></section><section id="view-calendar" class="view hidden"></section><section id="view-clients" class="view hidden"></section><section id="view-hours" class="view hidden"></section><section id="view-reviews" class="view hidden"></section><section id="view-services" class="view hidden"></section><section id="view-home-editor" class="view hidden"></section><section id="view-booking-settings" class="view hidden"></section></main></div>
