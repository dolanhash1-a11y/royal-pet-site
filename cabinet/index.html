<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Pet — Кабінет</title>
<link rel="stylesheet" href="style.css?v=12">
<link rel="stylesheet" href="mobile-menu.css?v=5">
</head>
<body>
<div id="login" class="login-page"><div class="login-card"><h1>Royal Pet</h1><p>Адміністративний кабінет</p><form id="login-form"><input id="login-user" placeholder="Логін" autocomplete="username" required><input id="login-pass" type="password" placeholder="Пароль" autocomplete="current-password" required><button class="small-btn gold" type="submit">Увійти</button><div id="login-error" class="error"></div></form></div></div>
<div id="app" class="app hidden">
<aside class="sidebar"><div class="brand">Royal Pet</div><nav><button class="nav-item active" data-view="dashboard">🏠 <span>Огляд</span></button><button class="nav-item" data-view="appointments">📋 <span>Записи</span><span id="new-count" class="nav-badge">0</span></button><button class="nav-item" data-view="calendar">📅 <span>Календар</span></button><button class="nav-item" data-view="hours">🕐 <span>Графік</span></button><button class="nav-item" data-view="reviews">⭐ <span>Відгуки</span></button><button class="nav-item" data-view="services">✂ <span>Послуги</span></button></nav><button id="logout" class="logout">🚪 Вийти</button></aside>
<main class="main"><header class="topbar"><h2 id="page-title">Огляд</h2></header><section id="view-dashboard" class="view"></section><section id="view-appointments" class="view hidden"></section><section id="view-calendar" class="view hidden"></section><section id="view-hours" class="view hidden"></section><section id="view-reviews" class="view hidden"></section><section id="view-services" class="view hidden"></section></main></div>
<script>window.ROYAL_PET_ADMIN_API=window.ROYAL_PET_ADMIN_API||'';</script>
<script src="app.js?v=9"></script>
<script src="calendar-fix.js?v=4"></script>
<script src="mobile-menu.js?v=4"></script>
</body>
</html>
