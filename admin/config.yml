backend:
  name: github
  repo: dolanhash1-a11y/royal-pet-site
  branch: main
  base_url: https://royal-pet-admin-login.dolanhash1.workers.dev
  auth_endpoint: auth

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "⚙️ Налаштування"
    files:
      - label: "Основні налаштування"
        name: "site"
        file: "content/site.json"
        fields:
          - label: "Назва студії"
            name: "name"
            widget: "string"
          - label: "Місто / підзаголовок"
            name: "location"
            widget: "string"
          - label: "Телефон"
            name: "phone"
            widget: "string"
          - label: "Адреса"
            name: "address"
            widget: "string"
          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false
          - label: "Telegram"
            name: "telegram"
            widget: "string"
            required: false
          - label: "Facebook"
            name: "facebook"
            widget: "string"
            required: false
          - label: "TikTok"
            name: "tiktok"
            widget: "string"
            required: false
          - label: "Основний колір"
            name: "primary_color"
            widget: "color"
            default: "#517064"
          - label: "Акцентний колір"
            name: "accent_color"
            widget: "color"
            default: "#d98370"

  - name: "home"
    label: "🏠 Головна"
    files:
      - label: "Головна сторінка"
        name: "home"
        file: "content/home.json"
        fields:
          - label: "Головний заголовок"
            name: "title"
            widget: "string"
          - label: "Підзаголовок"
            name: "subtitle"
            widget: "string"
          - label: "Опис"
            name: "description"
            widget: "text"
          - label: "Текст головної кнопки"
            name: "button_text"
            widget: "string"
          - label: "Посилання головної кнопки"
            name: "button_link"
            widget: "string"
          - label: "Текст другої кнопки"
            name: "secondary_button_text"
            widget: "string"
            required: false
          - label: "Посилання другої кнопки"
            name: "secondary_button_link"
            widget: "string"
            required: false
          - label: "Головне фото"
            name: "hero_image"
            widget: "image"
            required: false
          - label: "Підпис блоку «Про нас»"
            name: "about_label"
            widget: "string"
          - label: "Заголовок «Про нас»"
            name: "about_title"
            widget: "string"
          - label: "Підпис блоку «Послуги»"
            name: "services_label"
            widget: "string"
          - label: "Заголовок «Послуги»"
            name: "services_title"
            widget: "string"
          - label: "Текст біля послуг"
            name: "services_text"
            widget: "text"
          - label: "Підпис блоку «Галерея»"
            name: "gallery_label"
            widget: "string"
          - label: "Заголовок «Галерея»"
            name: "gallery_title"
            widget: "string"
          - label: "Підпис блоку «Відгуки»"
            name: "reviews_label"
            widget: "string"
          - label: "Заголовок «Відгуки»"
            name: "reviews_title"
            widget: "string"
          - label: "Підпис блоку «Запис»"
            name: "booking_label"
            widget: "string"
          - label: "Заголовок «Запис»"
            name: "booking_title"
            widget: "string"
          - label: "Текст блоку «Запис»"
            name: "booking_text"
            widget: "text"
          - label: "Примітка під текстом запису"
            name: "booking_note"
            widget: "text"
            required: false
          - label: "Поле: ім’я улюбленця"
            name: "form_pet_name_label"
            widget: "string"
          - label: "Підказка: ім’я улюбленця"
            name: "form_pet_name_placeholder"
            widget: "string"
          - label: "Поле: вік улюбленця"
            name: "form_age_label"
            widget: "string"
          - label: "Підказка: вік улюбленця"
            name: "form_age_placeholder"
            widget: "string"
          - label: "Поле: порода та розмір"
            name: "form_breed_label"
            widget: "string"
          - label: "Підказка: порода та розмір"
            name: "form_breed_placeholder"
            widget: "string"
          - label: "Поле: контакти власника"
            name: "form_owner_label"
            widget: "string"
          - label: "Підказка: контакти власника"
            name: "form_owner_placeholder"
            widget: "string"
          - label: "Поле: останній грумінг"
            name: "form_last_grooming_label"
            widget: "string"
          - label: "Підказка: останній грумінг"
            name: "form_last_grooming_placeholder"
            widget: "string"
          - label: "Поле: бажана дата й час"
            name: "form_preferred_time_label"
            widget: "string"
          - label: "Поле: додаткові послуги"
            name: "form_additional_label"
            widget: "string"
          - label: "Підказка: додаткові послуги"
            name: "form_additional_placeholder"
            widget: "string"
          - label: "Назва блоку «Домашній догляд»"
            name: "form_home_care_label"
            widget: "string"
          - label: "Варіант домашнього догляду №1"
            name: "form_home_care_option1"
            widget: "string"
          - label: "Варіант домашнього догляду №2"
            name: "form_home_care_option2"
            widget: "string"
          - label: "Варіант домашнього догляду №3"
            name: "form_home_care_option3"
            widget: "string"
          - label: "Поле: коментар"
            name: "form_comment_label"
            widget: "string"
          - label: "Підказка: коментар"
            name: "form_comment_placeholder"
            widget: "string"
          - label: "Текст кнопки форми"
            name: "form_submit"
            widget: "string"
          - label: "Текст під час відправлення"
            name: "form_sending"
            widget: "string"
          - label: "Повідомлення після успішної відправки"
            name: "form_success"
            widget: "text"
          - label: "Повідомлення про помилку"
            name: "form_error"
            widget: "text"
          - label: "Підпис блоку «Контакти»"
            name: "contacts_label"
            widget: "string"
          - label: "Заголовок «Контакти»"
            name: "contacts_title"
            widget: "string"
          - label: "Підпис блоку «Графік»"
            name: "hours_label"
            widget: "string"
          - label: "Заголовок «Графік»"
            name: "hours_title"
            widget: "string"

  - name: "services"
    label: "✂️ Послуги"
    files:
      - label: "Всі послуги"
        name: "services"
        file: "content/services.json"
        fields:
          - label: "Послуги"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - label: "Назва послуги"
                name: "title"
                widget: "string"
              - label: "Ціна"
                name: "price"
                widget: "string"
              - label: "Тривалість"
                name: "duration"
                widget: "string"
                required: false
              - label: "Категорія"
                name: "category"
                widget: "select"
                required: false
                options:
                  - "Грумінг"
                  - "Гігієна"
                  - "Догляд"
                  - "Додаткові послуги"
                  - "Інше"
              - label: "Опис"
                name: "description"
                widget: "text"
              - label: "Фото"
                name: "image"
                widget: "image"
                required: false
              - label: "Показувати на сайті"
                name: "active"
                widget: "boolean"
                default: true
              - label: "Порядок"
                name: "order"
                widget: "number"
                default: 0
                value_type: "int"

  - name: "about"
    label: "👑 Про студію"
    files:
      - label: "Інформація про студію"
        name: "about"
        file: "content/about.json"
        fields:
          - label: "Заголовок"
            name: "title"
            widget: "string"
          - label: "Опис"
            name: "text"
            widget: "text"
          - label: "Фото"
            name: "image"
            widget: "image"
            required: false
          - label: "Переваги"
            name: "benefits"
            widget: "list"
            required: false
            fields:
              - label: "Заголовок"
                name: "title"
                widget: "string"
              - label: "Опис"
                name: "text"
                widget: "text"
                required: false

  - name: "portfolio"
    label: "📸 Галерея"
    files:
      - label: "Фото та відео робіт"
        name: "works"
        file: "content/portfolio.json"
        fields:
          - label: "Роботи"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Назва"
                name: "title"
                widget: "string"
              - label: "Фото"
                name: "image"
                widget: "image"
                required: false
              - label: "Посилання на відео"
                name: "video_url"
                widget: "string"
                required: false
              - label: "Опис"
                name: "description"
                widget: "text"
                required: false

  - name: "reviews"
    label: "⭐ Відгуки"
    files:
      - label: "Всі відгуки"
        name: "reviews"
        file: "content/reviews.json"
        fields:
          - label: "Відгуки"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.rating}}⭐"
            fields:
              - label: "Ім'я клієнта"
                name: "name"
                widget: "string"
              - label: "Оцінка"
                name: "rating"
                widget: "select"
                options: ["1", "2", "3", "4", "5"]
                default: "5"
              - label: "Відгук"
                name: "text"
                widget: "text"
              - label: "Фото клієнта"
                name: "image"
                widget: "image"
                required: false
              - label: "Дата"
                name: "date"
                widget: "datetime"
                required: false
              - label: "Статус"
                name: "status"
                widget: "select"
                options:
                  - label: "🟡 На модерації"
                    value: "pending"
                  - label: "🟢 Опубліковано"
                    value: "published"
                  - label: "🔴 Приховано"
                    value: "hidden"
                default: "pending"

  - name: "contacts"
    label: "📞 Контакти"
    files:
      - label: "Контактна інформація"
        name: "contacts"
        file: "content/contacts.json"
        fields:
          - label: "Заголовок"
            name: "title"
            widget: "string"
          - label: "Текст"
            name: "text"
            widget: "text"
          - label: "Підпис адреси"
            name: "address_label"
            widget: "string"
          - label: "Підпис графіка"
            name: "hours_label"
            widget: "string"
          - label: "Підпис телефону"
            name: "phone_label"
            widget: "string"
          - label: "Додатковий телефон"
            name: "phone2"
            widget: "string"
            required: false
          - label: "Підпис Email"
            name: "email_label"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
            required: false
          - label: "Кнопка Instagram"
            name: "instagram_text"
            widget: "string"
          - label: "Кнопка Telegram"
            name: "telegram_text"
            widget: "string"

  - name: "social"
    label: "📱 Соцмережі"
    files:
      - label: "Посилання на соцмережі"
        name: "social"
        file: "content/social.json"
        fields:
          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false
          - label: "Telegram"
            name: "telegram"
            widget: "string"
            required: false
          - label: "Facebook"
            name: "facebook"
            widget: "string"
            required: false
          - label: "TikTok"
            name: "tiktok"
            widget: "string"
            required: false

  - name: "hours"
    label: "🕐 Графік роботи"
    files:
      - label: "Години роботи"
        name: "hours"
        file: "content/hours.json"
        fields:
          - label: "Понеділок"
            name: "monday"
            widget: "string"
          - label: "Вівторок"
            name: "tuesday"
            widget: "string"
          - label: "Середа"
            name: "wednesday"
            widget: "string"
          - label: "Четвер"
            name: "thursday"
            widget: "string"
          - label: "П'ятниця"
            name: "friday"
            widget: "string"
          - label: "Субота"
            name: "saturday"
            widget: "string"
          - label: "Неділя"
            name: "sunday"
            widget: "string"

  - name: "pages"
    label: "📄 Сторінки"
    files:
      - label: "Сторінки сайту"
        name: "pages"
        file: "content/pages.json"
        fields:
          - label: "Сторінки"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Назва в меню"
                name: "title"
                widget: "string"
              - label: "Адреса латиницею"
                name: "slug"
                widget: "string"
                pattern:
                  - '^[a-z0-9-]+$'
                  - 'Лише малі латинські літери, цифри та дефіс'
              - label: "Текст сторінки"
                name: "body"
                widget: "markdown"

  - name: "seo"
    label: "🔍 SEO"
    files:
      - label: "SEO налаштування"
        name: "seo"
        file: "content/seo.json"
        fields:
          - label: "Назва сайту"
            name: "title"
            widget: "string"
          - label: "Опис сайту"
            name: "description"
            widget: "text"
          - label: "Ключові слова"
            name: "keywords"
            widget: "string"
            required: false
          - label: "Зображення для соцмереж"
            name: "image"
            widget: "image"
            required: false

  - name: "menu"
    label: "🧭 Меню"
    files:
      - label: "Меню сайту"
        name: "menu"
        file: "content/menu.json"
        fields:
          - label: "Пункти меню"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "Назва"
                name: "title"
                widget: "string"
              - label: "Посилання"
                name: "url"
                widget: "string"
              - label: "Показувати"
                name: "active"
                widget: "boolean"
                default: true
              - label: "Порядок"
                name: "order"
                widget: "number"
                default: 0
                value_type: "int"

  - name: "footer"
    label: "🦶 Футер"
    files:
      - label: "Налаштування футера"
        name: "footer"
        file: "content/footer.json"
        fields:
          - label: "Основний текст"
            name: "text"
            widget: "text"
            required: false
          - label: "Копірайт"
            name: "copyright"
            widget: "string"
            required: false
          - label: "Додатковий текст"
            name: "description"
            widget: "text"
            required: false
