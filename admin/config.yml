backend:
  name: github
  repo: dolanhash1-a11y/royal-pet-site
  branch: main
  base_url: https://royal-pet-admin-login.dolanhash1.workers.dev
  auth_endpoint: auth

media_folder: "uploads"
public_folder: "/uploads"

collections:
  # =========================
  # НАЛАШТУВАННЯ САЙТУ
  # =========================
  - name: "settings"
    label: "⚙️ Налаштування сайту"
    files:
      - label: "Назва, контакти й кольори"
        name: "site"
        file: "content/site.json"
        fields:
          - label: "Назва студії"
            name: "name"
            widget: "string"
          - label: "Місто / підзаголовок"
            name: "location"
            widget: "string"
          - label: "Телефон"
            name: "phone"
            widget: "string"
          - label: "Адреса"
            name: "address"
            widget: "string"
          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false
          - label: "Telegram"
            name: "telegram"
            widget: "string"
            required: false
          - label: "Facebook"
            name: "facebook"
            widget: "string"
            required: false
          - label: "TikTok"
            name: "tiktok"
            widget: "string"
            required: false
          - label: "Основний колір"
            name: "primary_color"
            widget: "color"
            default: "#517064"
          - label: "Акцентний колір"
            name: "accent_color"
            widget: "color"
            default: "#d98370"

  # =========================
  # ПОСЛУГИ
  # =========================
  - name: "services"
    label: "✂️ Послуги"
    files:
      - label: "Всі послуги"
        name: "services"
        file: "content/services.json"
        fields:
          - label: "Послуги"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.price}}"
            fields:
              - label: "Назва послуги"
                name: "title"
                widget: "string"
              - label: "Ціна"
                name: "price"
                widget: "string"
                hint: "Використовується як базова ціна, якщо для послуги ще не заданий детальний прайс"
              - label: "Тривалість"
                name: "duration"
                widget: "string"
                required: false
                hint: "Наприклад: 1,5 години"
              - label: "Категорія"
                name: "category"
                widget: "select"
                required: false
                options:
                  - "Грумінг"
                  - "Гігієна"
                  - "Догляд"
                  - "Додаткові послуги"
                  - "Інше"
              - label: "Опис"
                name: "description"
                widget: "text"
              - label: "Фото"
                name: "image"
                widget: "image"
                required: false
              - label: "Показувати на сайті"
                name: "active"
                widget: "boolean"
                default: true
              - label: "Порядок"
                name: "order"
                widget: "number"
                default: 0
                value_type: "int"

  # =========================
  # ПРАЙС
  # =========================
  - name: "pricing"
    label: "💰 Прайс і доплати"
    files:
      - label: "Прайс за категоріями"
        name: "service-pricing"
        file: "content/service-pricing.json"
        fields:
          - label: "Категорії"
            name: "categories"
            widget: "object"
            fields:
              - label: "Мала"
                name: "small"
                widget: "string"
              - label: "Середня"
                name: "medium"
                widget: "string"
              - label: "Велика"
                name: "large"
                widget: "string"

          - label: "Стан шерсті"
            name: "coat_conditions"
            widget: "object"
            fields:
              - label: "Нормальний"
                name: "none"
                widget: "object"
                fields:
                  - label: "Назва"
                    name: "label"
                    widget: "string"
                  - label: "Пояснення"
                    name: "note"
                    widget: "string"
              - label: "Є ковтуни"
                name: "light"
                widget: "object"
                fields:
                  - label: "Назва"
                    name: "label"
                    widget: "string"
                  - label: "Пояснення"
                    name: "note"
                    widget: "string"
              - label: "Сильні ковтуни / запущена шерсть"
                name: "severe"
                widget: "object"
                fields:
                  - label: "Назва"
                    name: "label"
                    widget: "string"
                  - label: "Пояснення"
                    name: "note"
                    widget: "string"

          - label: "Стандартні доплати за стан шерсті"
            name: "default_coat_surcharges"
            widget: "object"
            fields:
              - label: "Нормальний, грн"
                name: "none"
                widget: "number"
                value_type: "int"
                default: 0
              - label: "Є ковтуни, грн"
                name: "light"
                widget: "number"
                value_type: "int"
                default: 200
              - label: "Сильні ковтуни, грн"
                name: "severe"
                widget: "number"
                value_type: "int"
                default: 400

          - label: "Прайс послуг"
            name: "services"
            widget: "object"
            fields:
              - label: "service-1 — Комплексний грумінг"
                name: "service-1"
                widget: "object"
                fields:
                  - label: "Мала, грн"
                    name: "small"
                    widget: "number"
                    value_type: "int"
                  - label: "Середня, грн"
                    name: "medium"
                    widget: "number"
                    value_type: "int"
                  - label: "Велика, грн"
                    name: "large"
                    widget: "number"
                    value_type: "int"
                  - label: "Є ковтуни, доплата, грн"
                    name: "light"
                    widget: "number"
                    value_type: "int"
                  - label: "Сильні ковтуни, доплата, грн"
                    name: "severe"
                    widget: "number"
                    value_type: "int"
              - label: "service-2 — Гігієнічний грумінг"
                name: "service-2"
                widget: "object"
                fields:
                  - label: "Мала, грн"
                    name: "small"
                    widget: "number"
                    value_type: "int"
                  - label: "Середня, грн"
                    name: "medium"
                    widget: "number"
                    value_type: "int"
                  - label: "Велика, грн"
                    name: "large"
                    widget: "number"
                    value_type: "int"
                  - label: "Є ковтуни, доплата, грн"
                    name: "light"
                    widget: "number"
                    value_type: "int"
                  - label: "Сильні ковтуни, доплата, грн"
                    name: "severe"
                    widget: "number"
                    value_type: "int"
              - label: "service-3 — Вичісування"
                name: "service-3"
                widget: "object"
                fields:
                  - label: "Мала, грн"
                    name: "small"
                    widget: "number"
                    value_type: "int"
                  - label: "Середня, грн"
                    name: "medium"
                    widget: "number"
                    value_type: "int"
                  - label: "Велика, грн"
                    name: "large"
                    widget: "number"
                    value_type: "int"
                  - label: "Є ковтуни, доплата, грн"
                    name: "light"
                    widget: "number"
                    value_type: "int"
                  - label: "Сильні ковтуни, доплата, грн"
                    name: "severe"
                    widget: "number"
                    value_type: "int"
              - label: "service-4 — Стрижка"
                name: "service-4"
                widget: "object"
                fields:
                  - label: "Мала, грн"
                    name: "small"
                    widget: "number"
                    value_type: "int"
                  - label: "Середня, грн"
                    name: "medium"
                    widget: "number"
                    value_type: "int"
                  - label: "Велика, грн"
                    name: "large"
                    widget: "number"
                    value_type: "int"
                  - label: "Є ковтуни, доплата, грн"
                    name: "light"
                    widget: "number"
                    value_type: "int"
                  - label: "Сильні ковтуни, доплата, грн"
                    name: "severe"
                    widget: "number"
                    value_type: "int"
              - label: "service-5 — Зубки"
                name: "service-5"
                widget: "object"
                fields:
                  - label: "Мала, грн"
                    name: "small"
                    widget: "number"
                    value_type: "int"
                  - label: "Середня, грн"
                    name: "medium"
                    widget: "number"
                    value_type: "int"
                  - label: "Велика, грн"
                    name: "large"
                    widget: "number"
                    value_type: "int"
                  - label: "Є ковтуни, доплата, грн"
                    name: "light"
                    widget: "number"
                    value_type: "int"
                  - label: "Сильні ковтуни, доплата, грн"
                    name: "severe"
                    widget: "number"
                    value_type: "int"

  # =========================
  # ПОРТФОЛІО
  # =========================
  - name: "portfolio"
    label: "📸 Галерея"
    files:
      - label: "Фото та відео робіт"
        name: "works"
        file: "content/portfolio.json"
        fields:
          - label: "Роботи"
            name: "items"
            widget: "list"
            fields:
              - label: "Назва"
                name: "title"
                widget: "string"
              - label: "Фото"
                name: "image"
                widget: "image"
                required: false
              - label: "Посилання на відео"
                name: "video_url"
                widget: "string"
                required: false
              - label: "Опис"
                name: "description"
                widget: "text"
                required: false

  # =========================
  # СТОРІНКИ
  # =========================
  - name: "pages"
    label: "📄 Сторінки"
    files:
      - label: "Нові сторінки"
        name: "pages"
        file: "content/pages.json"
        fields:
          - label: "Сторінки"
            name: "items"
            widget: "list"
            fields:
              - label: "Назва в меню"
                name: "title"
                widget: "string"
              - label: "Адреса латиницею"
                name: "slug"
                widget: "string"
                pattern:
                  - '^[a-z0-9-]+$'
                  - 'Лише малі латинські літери, цифри та дефіс'
              - label: "Текст сторінки"
                name: "body"
                widget: "markdown"
