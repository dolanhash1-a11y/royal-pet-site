name: Patch Worker Auth

on:
  push:
    paths:
      - .github/workflows/patch-worker-auth.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch login response
        shell: python
        run: |
          from pathlib import Path

          path = Path('cloudflare/royal-pet-admin-api-r2-final.js')
          text = path.read_text(encoding='utf-8')

          old = '''if(got!==hash)return json(r,{ok:false},401);return json(r,{ok:true},200,{"Set-Cookie":`rp_session=${await token(user,e.SESSION_SECRET)}; HttpOnly; Secure; SameSite=None; Path=/; Max-Age=86400`})'''
          new = '''if(got!==hash)return json(r,{ok:false},401);const sessionToken=await token(user,e.SESSION_SECRET);return json(r,{ok:true,token:sessionToken},200,{"Set-Cookie":`rp_session=${sessionToken}; HttpOnly; Secure; SameSite=None; Path=/; Max-Age=86400`})'''

          if old not in text:
              if 'const sessionToken=await token(user,e.SESSION_SECRET)' in text:
                  print('Already patched; nothing to do.')
                  raise SystemExit(0)
              raise SystemExit('Expected login code was not found; refusing to modify the Worker.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Worker login now returns the session token and keeps the HttpOnly cookie.')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/royal-pet-admin-api-r2-final.js
          git diff --cached --quiet && exit 0
          git commit -m "Return auth token for mobile cabinet"
          git push
